name: Build Emir Antivirus

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/EmirAntivirus/EmirAntivirus.csproj
      - name: Build
        run: dotnet build src/EmirAntivirus/EmirAntivirus.csproj --configuration Release --no-restore
