name: Build Emir Antivirus

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/EmirAntivirus/EmirAntivirus.csproj
      - name: Publish Windows x64 single-file app
        run: dotnet publish src/EmirAntivirus/EmirAntivirus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/EmirAntivirus-win-x64
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EmirAntivirus-win-x64
          path: artifacts/EmirAntivirus-win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/EmirAntivirus-win-x64/EmirAntivirus.exe
